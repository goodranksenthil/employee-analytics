# Render's free web service sleeps after 15 minutes without traffic, so the first request
# then takes ~1 minute. Pinging the health endpoint keeps it awake (one free instance running
# all month fits inside Render's 750 free hours). Delete this once on a paid plan.
name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 20 https://employee-analytics-api-tebl.onrender.com/api/health
      - name: Ping web app
        run: curl --fail --silent --show-error --max-time 60 -o /dev/null https://employee-analytics-seven.vercel.app/
