# Render Blueprint — FastAPI backend + managed PostgreSQL (same layout as cip-platform).
# Render → New → Blueprint → pick this repo. Secrets marked `sync: false` are asked for once.
# Database: shares the existing free Render Postgres `cip-db` (Render allows one free database
# per workspace). All tables live in their own schema (DB_SCHEMA), so CIP's tables are untouched.
# cip-db's free plan expires after 30 days; upgrade it or point DATABASE_URL elsewhere.
# See docs/DEPLOY.md.

services:
  - type: web
    name: employee-analytics-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths: ["backend/**"]   # frontend-only commits don't redeploy the API
    region: singapore
    plan: free                 # sleeps after 15 min idle; see .github/workflows/keep-awake.yml
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render-managed Postgres (cip-db), wired in automatically — no password is typed anywhere.
      - key: DATABASE_URL
        fromDatabase:
          name: cip-db
          property: connectionString
      - key: DB_SCHEMA
        value: employee_analytics
      # Comma-separated Vercel production URL(s), e.g. https://employee-analytics.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Optional, for Vercel preview deployments, e.g. ^https://employee-analytics-[a-z0-9-]+\.vercel\.app$
      - key: CORS_ORIGIN_REGEX
        sync: false
      # Signs login tokens. Render generates a random value once; changing it signs everyone out.
      - key: SECRET_KEY
        generateValue: true
      # Load the sample employees/projects and the 4 demo logins into an empty database on first start.
      - key: SEED_DEMO_DATA
        value: "true"
